; ─────────────────────────────────────────────────────────────────────────────
;  Préréglages du routeur llama-server — boow control
;  Un seul serveur, plusieurs cerveaux chargés à la demande (--models-max 1).
;  Les noms de section = les identifiants « model » vus par l'API OpenAI.
;  Chantier 2 de CARTE.md. Remplace llama-brain.sh + llama-swap.yaml.
; ─────────────────────────────────────────────────────────────────────────────

[*]
; Réglages communs à tous les cerveaux (repris de llama-brain.sh)
flash-attn   = on
jinja        = 1
mmap         = 0
n-gpu-layers = 99

; L'ancien cerveau Qwen3-Coder-30B a été retiré le 22/07/2026 : à mémoire GPU
; égale il plafonnait à 19,5 t/s contre 25,6 pour son remplaçant.

; ── CERVEAU PRINCIPAL — qualité maximale ─────────────────────────────────────
; n-cpu-moe = 20 : mesuré le 22/07/2026 comme le meilleur réglage tenant sous
; les 15,4 Go de plafond (14,4 Go, 25,6 t/s). À 16, ça déborde à 15,8 Go.
[qwen3.6-35b]
model          = /home/USER/models/qwen3.6-35b-a3b-UD-Q4_K_XL.gguf
ctx-size       = 65536
n-cpu-moe      = 20
cache-type-k   = q8_0
cache-type-v   = q8_0
temp           = 0.7
top-p          = 0.8
top-k          = 20
repeat-penalty = 1.05

; ── CERVEAU RAPIDE — même modèle, compression plus forte ─────────────────────
; n-cpu-moe = 12 : 14,3 Go et 39,3 t/s, soit deux fois l'ancien cerveau.
; Un poil moins fin dans le raisonnement : à réserver aux réponses rapides.
[qwen3.6-35b-leger]
model          = /home/USER/models/qwen3.6-35b-a3b-UD-Q3_K_XL.gguf
ctx-size       = 65536
n-cpu-moe      = 12
cache-type-k   = q8_0
cache-type-v   = q8_0
temp           = 0.7
top-p          = 0.8
top-k          = 20
repeat-penalty = 1.05

; ── ŒIL nouvelle génération (lecture d'interfaces et de maquettes) ───────────
[qwen3-vl-8b]
model    = /home/USER/models/qwen3-vl-8b-Q4_K_M.gguf
mmproj   = /home/USER/models/qwen3-vl-8b-mmproj-F16.gguf
ctx-size = 32768

; L'ancien œil Qwen2.5-VL-7B a été retiré le 22/07/2026, remplacé par le 8B.

; ── PENSEUR (raisonnement) ───────────────────────────────────────────────────
[qwen3-14b]
hf       = unsloth/Qwen3-14B-GGUF:Q4_K_M
ctx-size = 32768

; ── SPRINTEUR (réponses instantanées) ────────────────────────────────────────
[qwen3-4b]
hf       = unsloth/Qwen3-4B-GGUF:Q4_K_M
ctx-size = 16384
